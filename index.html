<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14181f">
<title>Pro Option Sell Scanner</title>
<!-- TradingView Widget Script -->
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1b2330;--mute:#667085;--line:#dde2ea;--ok:#1f7a45;--warn:#b45f06;--accent:#2f4bb8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14181f;--card:#1d232d;--ink:#e8ecf3;--mute:#98a2b3;--line:#2c3441;--ok:#4cc38a;--warn:#f0a53c;--accent:#8aa4ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
h1{font-size:20px;margin:0 0 12px}
h2{font-size:16px;margin:18px 0 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select,button{font:inherit;border-radius:8px;border:1px solid var(--line);padding:10px 12px;background:var(--card);color:var(--ink)}
input{flex:1 1 200px}
button{background:var(--accent);color:#fff;border:0;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
.sym{margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.sym b{font-size:17px}.mute{color:var(--mute);font-size:13px}
.warn{color:var(--warn);font-size:13px;margin:4px 0}
.opt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:8px;font-weight:600;align-items:center}
.pop{height:8px;border-radius:4px;background:var(--line);margin:8px 0;overflow:hidden}
.pop i{display:block;height:100%;background:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:13px}
.grid span{color:var(--mute)}
.err{color:var(--warn)}
button#auto{background:var(--ok);color:#fff}
@media (prefers-color-scheme:dark){button#auto{color:#0b1b12}}
.note{margin-top:20px;font-size:12px;color:var(--mute)}

/* Badges & Chart Button */
.badge-group{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0;align-items:center}
.badge{padding:2px 6px;border-radius:4px;font-size:11px;font-weight:bold}
.badge-hot{background:#ffebee;color:#c62828}
.badge-cold{background:#fff3e0;color:#ef6c00}
.badge-sd{background:#e8f5e9;color:#2e7d32}
.badge-tech{background:#e3f2fd;color:#1565c0}
.badge-pot{background:#f3e5f5;color:#7b1fa2}
.btn-chart{padding:3px 8px;font-size:11px;border-radius:4px;background:var(--card);color:var(--accent);border:1px solid var(--accent);cursor:pointer;margin-left:auto}

@media (prefers-color-scheme:dark){
  .badge-hot{background:#441a1d;color:#ff8a80}
  .badge-cold{background:#3e2723;color:#ffb74d}
  .badge-sd{background:#1b3824;color:#81c784}
  .badge-tech{background:#182b49;color:#90caf9}
  .badge-pot{background:#381c3d;color:#ce93d8}
}

.chart-container{margin-top:10px;height:340px;border-radius:8px;overflow:hidden;border:1px solid var(--line);display:none}

.bt-box{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px;margin-top:24px}
.bt-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:10px}
.bt-field label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.bt-field input,.bt-field select{width:100%}
#bt_result{margin-top:12px;display:none;padding:12px;border-radius:8px;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<h1>Option Sell Scanner (Pro)</h1>
<div class="bar">
  <input id="syms" value="NIFTY,BANKNIFTY,RELIANCE,HDFCBANK" aria-label="Symbols, comma se alag">
  <button id="go">Scan karo</button>
  <button id="auto">Auto scan</button>
</div>
<div id="out" class="mute">Symbols likhkar "Scan karo" dabao. Stocks mein 1 symbol ~5 second leta hai.</div>

<!-- Backtest & P&L Calculator Section -->
<div class="bt-box">
  <h2 style="margin-top:0;">Option Sell Historical Backtest & P&L</h2>
  <div class="bt-grid">
    <div class="bt-field">
      <label>Symbol / Share</label>
      <input type="text" id="bt_symbol" value="LUPIN" placeholder="e.g. LUPIN, NIFTY">
    </div>
    <div class="bt-field">
      <label>Strike Price</label>
      <input type="number" id="bt_strike" placeholder="e.g. 2000">
    </div>
    <div class="bt-field">
      <label>Option Type</label>
      <select id="bt_type">
        <option value="CE">Call (CE)</option>
        <option value="PE">Put (PE)</option>
      </select>
    </div>
    <div class="bt-field">
      <label>Sell Premium (₹)</label>
      <input type="number" id="bt_premium" step="0.05" placeholder="e.g. 43">
    </div>
    <div class="bt-field">
      <label>Expiry Date (Backtest)</label>
      <input type="date" id="bt_date">
    </div>
    <div class="bt-field">
      <label>Lot Size</label>
      <input type="number" id="bt_lot" value="425" placeholder="e.g. 425">
    </div>
    <div class="bt-field">
      <label>Ya Manual Spot (Optional)</label>
      <input type="number" id="bt_expiry" step="0.05" placeholder="e.g. 1980">
    </div>
  </div>
  <button onclick="runBacktest()" style="margin-top:12px;width:100%;">Check Historical Profit / Loss</button>
  <div id="bt_result"></div>
</div>

<p class="note">POP delta se nikala gaya andaaza hai. 1-SD aur POT market volatility par aadharit hain. Stop-loss sirf suggestion hai, ye app order nahi daalta.</p>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let key=localStorage.getItem("key")||"";

async function scan(){
  $("go").disabled=true;$("out").textContent="Scan ho raha hai...";
  try{
    const r=await fetch("/api/scan?symbols="+encodeURIComponent($("syms").value),{headers:{"x-key":key}});
    if(r.status===401){key=prompt("App password daalo")||"";localStorage.setItem("key",key);return scan();}
    render(await r.json());
  }catch(e){$("out").innerHTML='<span class="err">Server se connect nahi hua. Check karo scanner chal raha hai.</span>';}
  $("go").disabled=false;
}

let cardCounter = 0;

function card(p, sym){
  cardCounter++;
  const cId = "tv_chart_" + cardCounter;
  let badges = [];
  if(p.ivr >= 50) badges.push('<span class="badge badge-hot">🔥 High IVR '+p.ivr+'%</span>');
  else if(p.ivr < 25) badges.push('<span class="badge badge-cold">⚠️ Low IVR '+p.ivr+'%</span>');
  
  if(p.is_outside_sd) badges.push('<span class="badge badge-sd">🛡️ Outside 1-SD Safe</span>');
  if(p.tech_note) badges.push('<span class="badge badge-tech">📈 '+esc(p.tech_note)+'</span>');
  badges.push('<span class="badge badge-pot">⚡ POT: '+p.pot+'%</span>');

  return '<div class="opt"><div class="top"><span>SELL '+esc(p.contract)+' @ '+p.ltp+'</span><span>POP '+p.pop+'%</span></div>'
  +'<div class="badge-group">' + badges.join("") 
  + '<button class="btn-chart" onclick="toggleChart(\''+cId+'\', \''+esc(sym)+'\')">📊 Chart</button>'
  +'</div>'
  +'<div class="pop"><i style="width:'+p.pop+'%"></i></div><div class="grid">'
  +'<div><span>Premium/lot </span>₹'+p.premium_lot+'</div><div><span>Lot </span>'+p.lot+'</div>'
  +'<div><span>Stop-loss </span>'+p.sl_price+'</div><div><span>SL par nuksaan </span>₹'+p.loss_at_sl+'</div>'
  +'<div><span>Breakeven </span>'+p.breakeven+'</div><div><span>Spot se door </span>'+p.dist_pct+'%</div>'
  +'<div><span>Expected Move </span>±₹'+p.exp_move+'</div><div><span>Touch Risk (POT) </span>'+p.pot+'%</div>'
  +'<div><span>IV / IVP </span>'+esc(p.iv)+' / '+p.ivp+'%</div><div><span>OI / Vol </span>'+p.oi+' / '+p.vol+'</div>'
  +'<div><span>Spread </span>'+p.spread_pct+'%</div></div>'
  +'<div id="'+cId+'" class="chart-container"></div>'
  +'</div>';
}

function render(d){
  let h='<div class="mute">Update: '+esc(d.time)+'</div>';
  for(const s of d.results){
    if(s.error){h+='<div class="sym"><b>'+esc(s.symbol)+'</b></div><div class="err">'+esc(s.error)+'</div>';continue;}
    let emaInfo = s.ema20 ? ' | 20 EMA: ₹'+s.ema20 : '';
    h+='<div class="sym"><b>'+esc(s.symbol)+' '+s.spot+'</b><span class="mute">Expiry '+esc(s.expiry)+' ('+s.days+' din)'+emaInfo+'</span></div>';
    for(const w of s.warnings)h+='<div class="warn">'+esc(w)+'</div>';
    if(!s.picks.length)h+='<div class="mute">Filter ke hisaab se koi achha strike nahi mila.</div>';
    for(const p of s.picks)h+=card(p, s.symbol);
  }
  $("out").innerHTML=h;
}

// Chart toggle and loader
const activeCharts = {};
function toggleChart(cId, symbol){
  const el = document.getElementById(cId);
  if(!el) return;
  if(el.style.display === "block"){
    el.style.display = "none";
    return;
  }
  el.style.display = "block";
  if(!activeCharts[cId]){
    let tvSym = "NSE:" + symbol;
    if(symbol === "NIFTY") tvSym = "NSE:NIFTY50";
    else if(symbol === "BANKNIFTY") tvSym = "NSE:BANKNIFTY";

    const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    new TradingView.widget({
      "autosize": true,
      "symbol": tvSym,
      "interval": "D",
      "timezone": "Asia/Kolkata",
      "theme": isDark ? "dark" : "light",
      "style": "1",
      "locale": "in",
      "enable_publishing": false,
      "hide_top_toolbar": false,
      "hide_legend": true,
      "save_image": false,
      "container_id": cId
    });
    activeCharts[cId] = true;
  }
}

$("go").onclick=scan;

let timer=null;
async function auto(refresh){
  clearTimeout(timer);
  try{
    const r=await fetch("/api/auto"+(refresh?"?refresh=true":""),{headers:{"x-key":key}});
    if(r.status===401){key=prompt("App password daalo")||"";localStorage.setItem("key",key);return auto(refresh);}
    const d=await r.json();renderAuto(d);
    if(d.running)timer=setTimeout(()=>auto(false),4000);
  }catch(e){$("out").innerHTML='<span class="err">Server se connect nahi hua. Check karo scanner chal raha hai.</span>';}
}

function renderAuto(d){
  let h='<div class="mute">'+(d.running?'Scan chal raha hai: '+d.done+'/'+d.total+' symbol (zyada se zyada 3-4 minute)':'Poora hua: '+esc(d.updated||'-'))+'</div>';
  if(d.errors.length)h+='<div class="warn">'+d.errors.length+' symbol skip hue: '+esc(d.errors.slice(0,2).join("; "))+'</div>';
  if(!d.picks.length&&!d.running)h+='<div class="mute">Filter ke hisaab se koi achha mauka nahi mila.</div>';
  for(const p of d.picks){
    h+='<div class="sym"><b>'+esc(p.symbol)+' '+p.spot+'</b><span class="mute">Expiry '+esc(p.expiry)+' ('+p.days+' din)</span></div>';
    for(const w of p.warnings)h+='<div class="warn">'+esc(w)+'</div>';
    h+=card(p, p.symbol);
  }
  $("out").innerHTML=h;
}

$("auto").onclick=()=>auto(true);

// Backtest Execution Logic
async function runBacktest(){
  const sym = $("bt_symbol").value.trim().toUpperCase();
  const strike = parseFloat($("bt_strike").value);
  const premium = parseFloat($("bt_premium").value);
  const expiryDate = $("bt_date").value;
  const manualSpot = $("bt_expiry").value ? parseFloat($("bt_expiry").value) : null;
  const lot = parseInt($("bt_lot").value) || 1;
  const type = $("bt_type").value;
  const resDiv = $("bt_result");

  if(!sym || isNaN(strike) || isNaN(premium) || (!expiryDate && manualSpot === null)){
    resDiv.style.display = "block";
    resDiv.style.background = "rgba(180, 95, 6, 0.15)";
    resDiv.style.color = "var(--warn)";
    resDiv.innerHTML = "Kripya Symbol, Strike, Premium aur Expiry Date bharein.";
    return;
  }

  resDiv.style.display = "block";
  resDiv.style.background = "rgba(100, 100, 100, 0.15)";
  resDiv.style.color = "var(--ink)";
  resDiv.innerHTML = "Historical data fetch ho raha hai...";

  try {
    const r = await fetch("/api/backtest", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-key": key
      },
      body: JSON.stringify({
        symbol: sym,
        strike: strike,
        entry_premium: premium,
        expiry_date: expiryDate,
        expiry_price: manualSpot,
        option_type: type,
        lot_size: lot
      })
    });

    if(r.status === 401){
      key = prompt("App password daalo") || "";
      localStorage.setItem("key", key);
      return runBacktest();
    }

    const data = await r.json();

    if(data.status === "success"){
      const isProfit = data.total_pnl >= 0;
      resDiv.style.background = isProfit ? "rgba(31, 122, 69, 0.15)" : "rgba(220, 53, 69, 0.15)";
      resDiv.style.color = isProfit ? "var(--ok)" : "#e63946";
      resDiv.innerHTML = `
        <b>Nateeja: ${data.verdict === 'PROFIT' ? 'Munafa (PROFIT)' : 'Nuksaan (LOSS)'}</b><br>
        Expiry Closing Spot: <b>₹${data.expiry_price}</b><br>
        Total P&L: <b>₹${data.total_pnl}</b> (${data.roi_pct}% of premium)<br>
        P&L Per Share: ₹${data.pnl_per_share} | Intrinsic Value: ₹${data.intrinsic_value}
      `;
    } else {
      resDiv.style.background = "rgba(220, 53, 69, 0.15)";
      resDiv.style.color = "#e63946";
      resDiv.innerHTML = data.message || "Calculation fail ho gayi. Dobara koshish karein.";
    }
  } catch(e) {
    resDiv.style.background = "rgba(220, 53, 69, 0.15)";
    resDiv.style.color = "#e63946";
    resDiv.innerHTML = "Server se connect nahi hua. Check karein backend chal raha hai.";
  }
}
</script>
</body>
</html>
